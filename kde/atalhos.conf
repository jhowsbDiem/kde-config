# Atalhos globais aplicados pelo install.sh (opção --atalhos).
#
# Formato:  componente | ação | atalhos
#   - vários atalhos são separados por vírgula
#   - "none" remove todos os atalhos da ação
#   - modificadores: Meta, Ctrl, Alt, Shift  (ex.: Ctrl+Alt+T)
#   - teclas: letras, números, F1–F35, Space, Meta, Search
#
# A ORDEM IMPORTA: um atalho só pode pertencer a uma ação por vez, então
# ele precisa ser liberado antes de ser usado em outro lugar.
#
# Os nomes de componente e ação estão em ~/.config/kglobalshortcutsrc.

# Libera Meta+T (editor de tiling) para o Konsole
kwin                     | Edit Tiles                    | none

# Libera a tecla Meta (menu de aplicativos) para o KRunner
plasmashell              | activate application launcher | Alt+F1

# KRunner (busca)
org.kde.krunner.desktop  | _launch                       | Meta, Search, Alt+Space, Alt+F2

# Konsole
org.kde.konsole.desktop  | _launch                       | Ctrl+Alt+T, Meta+T

# Atividades
plasmashell              | next activity                 | Meta+A
plasmashell              | previous activity             | Meta+Shift+A
