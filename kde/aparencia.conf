# Aparência do KDE Plasma aplicada pelo install.sh (opção --aparencia).
# Sintaxe de variáveis do bash: este arquivo é carregado com "source".

# Esquema de cores dos aplicativos (nome em /usr/share/color-schemes, sem .colors)
ESQUEMA_CORES="BreezeDark"

# Tema de ícones (pasta em /usr/share/icons ou ~/.local/share/icons)
TEMA_ICONES="char-white"

# Efeitos do KWin, pelo nome interno
# (Configurações do Sistema → Gerenciamento de janelas → Efeitos da área de trabalho)
EFEITOS_LIGADOS=(
    glide           # Deslizar: animação ao abrir e fechar janelas
    magiclamp       # Lâmpada mágica: animação ao minimizar
    wobblywindows   # Janelas gelatinosas ao mover
)

EFEITOS_DESLIGADOS=(
    scale           # Escala: substituído pelo Deslizar
    squash          # Esmagar: substituído pela Lâmpada mágica
)
